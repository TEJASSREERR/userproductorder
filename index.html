<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Django API Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div id="toast-container"></div>

<div id="app">

  <nav id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">Admin Console</div>
      <h1>Django<span>API</span></h1>
    </div>

    <div class="nav-section">
      <div class="nav-label">Overview</div>
      <a class="nav-item" href="#/" data-route="dashboard">
        <span class="icon">◈</span> Dashboard
      </a>

      <div class="divider"></div>
      <div class="nav-label">Resources</div>

      <a class="nav-item" href="#/users" data-route="users">
        <span class="icon">◎</span> Users
        <span class="badge" id="badge-users">0</span>
      </a>
      <div class="nav-sub" id="sub-users" style="display:none">
        <a class="nav-item" href="#/users/new" data-route="users-new">＋ New User</a>
      </div>

      <a class="nav-item" href="#/products" data-route="products">
        <span class="icon">◫</span> Products
        <span class="badge" id="badge-products">0</span>
      </a>
      <div class="nav-sub" id="sub-products" style="display:none">
        <a class="nav-item" href="#/products/new" data-route="products-new">＋ New Product</a>
      </div>

      <a class="nav-item" href="#/orders" data-route="orders">
        <span class="icon">◳</span> Orders
        <span class="badge" id="badge-orders">0</span>
      </a>
      <div class="nav-sub" id="sub-orders" style="display:none">
        <a class="nav-item" href="#/orders/new" data-route="orders-new">＋ New Order</a>
      </div>
    </div>

    <div class="api-bar">
      <div class="api-label">API Base URL</div>
      <div class="api-input-row">
        <input type="text" id="api-url" value="http://localhost:8000" placeholder="http://localhost:8000"/>
        <button onclick="connectAPI()">LINK</button>
      </div>
      <div class="api-status demo" id="api-status">● DEMO MODE</div>
    </div>
  </nav>

  <div id="main">
    <div id="topbar">
      <div class="breadcrumb" id="breadcrumb">
        <span>Dashboard</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" onclick="refreshData()">↻ Refresh</button>
      </div>
    </div>
    <div id="page-content">
      <div class="loading">
        <div class="spinner"></div> Loading...
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
