<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Django API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-100 font-sans">
    
    <!-- Navigation Sidebar -->
    <nav class="fixed left-0 top-0 h-full w-64 bg-gray-900 text-white transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50" id="sidebar">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold text-center">
                <i class="fas fa-cube mr-2"></i>Admin Panel
            </h1>
        </div>
        <ul class="mt-6 space-y-2 px-4">
            <li>
                <a href="#/" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors nav-link" data-route="/">
                    <i class="fas fa-tachometer-alt w-6"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="#/users" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors nav-link" data-route="/users">
                    <i class="fas fa-users w-6"></i>
                    <span>Users</span>
                </a>
            </li>
            <li>
                <a href="#/products" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors nav-link" data-route="/products">
                    <i class="fas fa-box w-6"></i>
                    <span>Products</span>
                </a>
            </li>
            <li>
                <a href="#/orders" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors nav-link" data-route="/orders">
                    <i class="fas fa-shopping-cart w-6"></i>
                    <span>Orders</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Mobile Menu Button -->
    <button id="menu-btn" class="fixed top-4 left-4 z-50 md:hidden bg-gray-900 text-white p-3 rounded-lg shadow-lg">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Main Content -->
    <main class="md:ml-64 min-h-screen p-4 sm:p-6 md:p-8 lg:p-10" id="main-content">
        <div class="flex items-center justify-center h-64">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-500"></i>
        </div>
    </main>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 transition-transform duration-300 z-50">
        <span id="toast-message"></span>
    </div>

    <!-- Load scripts in order -->
    <script src="utils/api.js"></script>
    <script src="pages/dashboard.js"></script>
    <script src="pages/users.js"></script>
    <script src="pages/userForm.js"></script>
    <script src="pages/userDetail.js"></script>
    <script src="pages/products.js"></script>
    <script src="pages/productForm.js"></script>
    <script src="pages/productDetail.js"></script>
    <script src="pages/orders.js"></script>
    <script src="pages/orderForm.js"></script>
    <script src="pages/orderDetail.js"></script>
    <script src="script.js"></script>
</body>
</html>
