<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Project - Tailwind CSS</title>
    <!-- Link the output.css generated by Tailwind -->
    <link rel="stylesheet" href="output.css">
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-8 sm:px-6 md:px-8 lg:px-12">

    <!-- Main Container -->
    <div class="bg-white w-full max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg xl:max-w-xl 2xl:max-w-2xl 
                p-6 sm:p-8 md:p-10 lg:p-12 xl:p-14 2xl:p-16 
                rounded-lg sm:rounded-xl md:rounded-2xl 
                shadow-md sm:shadow-lg md:shadow-xl lg:shadow-2xl 
                border border-gray-200 sm:border-gray-300 
                transition-all duration-300 ease-in-out">

        <!-- Title -->
        <h1 id="title" class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl xl:text-6xl 2xl:text-7xl 
                             font-bold text-center text-gray-800 
                             mb-4 sm:mb-5 md:mb-6 lg:mb-7 xl:mb-8 
                             tracking-tight sm:tracking-normal md:tracking-wide 
                             leading-tight sm:leading-snug md:leading-normal
                             transition-colors duration-300">
            Document Object Model
        </h1>

        <!-- Paragraph -->
        <p id="text" class="text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl 2xl:text-3xl 
                              text-center text-gray-600 
                              mb-6 sm:mb-7 md:mb-8 lg:mb-9 xl:mb-10 
                              leading-relaxed sm:leading-loose 
                              px-2 sm:px-4 md:px-6 lg:px-8
                              transition-all duration-300">
            Click the button to change this text.
        </p>

        <!-- Buttons Container -->
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 md:gap-5 lg:gap-6 
                    justify-center items-center 
                    mt-4 sm:mt-6 md:mt-8">

            <!-- Change Text Button -->
            <button id="btn-text" class="w-full sm:w-auto 
                         px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 
                         py-2 sm:py-2.5 md:py-3 lg:py-3.5 xl:py-4 
                         text-sm sm:text-base md:text-lg lg:text-xl 
                         font-semibold text-white 
                         bg-green-500 sm:bg-green-600 md:bg-green-700 
                         hover:bg-green-600 sm:hover:bg-green-700 md:hover:bg-green-800 
                         active:bg-green-700 sm:active:bg-green-800 
                         rounded-md sm:rounded-lg md:rounded-xl 
                         shadow-sm sm:shadow-md md:shadow-lg 
                         hover:shadow-md sm:hover:shadow-lg md:hover:shadow-xl 
                         transition-all duration-200 ease-out 
                         transform hover:scale-105 active:scale-95 
                         cursor-pointer 
                         focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-offset-2">
                Change Text
            </button>

            <!-- Change Color Button -->
            <button id="btn-color" class="w-full sm:w-auto 
                         px-4 sm:px-6 md:px-8 lg:px-10 xl:px-12 
                         py-2 sm:py-2.5 md:py-3 lg:py-3.5 xl:py-4 
                         text-sm sm:text-base md:text-lg lg:text-xl 
                         font-semibold text-white 
                         bg-blue-500 sm:bg-blue-600 md:bg-blue-700 
                         hover:bg-blue-600 sm:hover:bg-blue-700 md:hover:bg-blue-800 
                         active:bg-blue-700 sm:active:bg-blue-800 
                         rounded-md sm:rounded-lg md:rounded-xl 
                         shadow-sm sm:shadow-md md:shadow-lg 
                         hover:shadow-md sm:hover:shadow-lg md:hover:shadow-xl 
                         transition-all duration-200 ease-out 
                         transform hover:scale-105 active:scale-95 
                         cursor-pointer 
                         focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2">
                Change Color
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
